<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1128" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CLOS" />

  <title>C.L.O.S. - Contact Lens Ordering System | Pal Optical</title>
  <meta name="description" content="Dedicated Contact Lens Ordering and 50-Row Waiting to Pick Up Management System for Pal Optical" />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/forms.css" />
  <link rel="stylesheet" href="./src/styles/print.css" media="print" />
  <link rel="stylesheet" href="./src/styles/splash.css" />
  <link rel="stylesheet" href="./src/styles/auth.css" />
  <link rel="stylesheet" href="./src/styles/clos-shell.css" />
</head>

<body>
  <!-- 1.5s Animated Splash Screen Container -->
  <div id="clos-splash-screen"></div>

  <!-- Login Window Overlay -->
  <div id="clos-auth-overlay" style="display: none;"></div>

  <!-- Main C.L.O.S. App Container -->
  <div id="clos-app-root" style="display: none;">
    <!-- Sticky Executive Top Bar -->
    <div id="clos-header-target"></div>

    <!-- Main Workspace -->
    <main class="clos-app-body">
      <!-- Contact Lens Orders & 50-Row Waiting Sheets Viewport -->
      <section id="clos-form-viewport"></section>

      <!-- Visual Drawer Inventory Viewport -->
      <section id="clos-drawer-viewport" style="display: none;"></section>
    </main>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="./src/main.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('C.L.O.S. PWA Worker active:', reg.scope))
          .catch((err) => console.warn('PWA Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
